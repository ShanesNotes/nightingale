# Globs: `*` stays inside one path segment and `**` crosses segments. The first rule that
# matches a path wins for it, a run takes the union of its paths' rules, and a path no rule matches runs
# everything.
schema = 1

always = ["01-toolchain"]

crate_steps = ["05-seam", "10-rust", "15-f64"]

[[rule]]
paths = [
  "rust-toolchain.toml", "Cargo.toml", "Cargo.lock", "clippy.toml", "rustfmt.toml", ".cargo/**",
  "tools/**", ".agents/skills/verify-nightingale/**", ".claude/**",
]
run = "everything"

[[rule]]
paths = ["crates/*/**"]
run = "crate"

[[rule]]
paths = ["docs/architecture/solver-contract.md"]
run = ["05-seam", "10-docs", "20-sketch"]
docs_only = true

[[rule]]
paths = ["docs/architecture/**", "docs/atlas/**"]
run = ["10-docs", "20-sketch"]
docs_only = true

[[rule]]
paths = ["docs/**", "*.md"]
run = ["10-docs"]
docs_only = true

[[rule]]
paths = [".scratch/**/*.md"]
run = ["30-data"]
docs_only = true

[[rule]]
paths = ["data/**"]
run = ["30-data"]

# One row per workspace member, named for its directory: the member lives at crates/<name>.
# Optional keys:
#   smoke = ["trace"]                          test targets every merge run that reaches a crate runs
#   dev_external = { expect-test = "=1.5.1" }  dev-dependencies from outside the workspace, at exact versions;
#                                              refused for a physiology closure crate and for a
#                                              helper whose file readers gate.py's FILE_READERS lacks
#   [[crate.f64_allow]]                        a public item allowed a bare f64 or f32, as
#   item = "quantity::Measure::new"            15-f64 names it; an entry that matches no
#   reason = "..."                             item fails
[[crate]]
name = "ng-contract"

[[crate.f64_allow]]
item = "quantity::Measure::new"
reason = "the parser where a raw number becomes a dimensioned measure, refused unless finite"

[[crate.f64_allow]]
item = "pinned::exp"
reason = "the arithmetic profile's own routine, a number in and a number out; the accuracy gate's closed form reads it"

[[crate.f64_allow]]
item = "problem::SolveWorkspace::unknowns_mut"
reason = "trial coordinates a core writes, in row order; amounts are never read back from them"

[[crate.f64_allow]]
item = "problem::SolveWorkspace::derivative_mut"
reason = "the tangent a stage evaluates against, one solver coordinate per row"

[[crate.f64_allow]]
item = "quadrature::StageEvaluation::residuals"
reason = "F per row, in mixed row dimensions: what a Newton core drives to zero and an explicit core reads as rates"

[[crate.f64_allow]]
item = "admission::InitializationSystem::evaluate"
reason = "one row per unknown of the admission system, in mixed row dimensions: what its Newton solve drives to zero"

[[crate.f64_allow]]
item = "problem::SparseView::values"
reason = "Jacobian entries in mixed row and column dimensions, for a core's own linear solve"

[[crate]]
name = "ng-record"

[[crate]]
name = "ng-observe"

[[crate]]
name = "ng-validate"
