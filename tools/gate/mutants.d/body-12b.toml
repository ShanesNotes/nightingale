[[mutant]]
name = "the-salts-ride-on-the-evaporated-water"
path = "crates/ng-metabolism/src/heat.rs"
old = '''    let secreted = &sweat.rate;'''
new = '''    let carried = laws.algebraic::<Rate<Water>>("evaporated water", Admissible::finite());
    let evaporated = laws.kernel(|mut k| {
        let (own, heat, latent) = (k.algebraic(&carried), k.algebraic(&rate), k.parameter(&latent));
        let ratio = k.divide(heat, latent);
        let water: Expr<'_, '_, Mt, Rate<Water>> = k.as_dimension(ratio);
        let residual = k.subtract(own, water);
        k.finish(residual, laws.every_mode(), class)
    });
    laws.residual(&carried, evaporated);
    let secreted = &carried;'''
test = "-p ng-validate --test body_run each_tissue_heat_law_matches_its_form_in_two_rooms_and_evaporation_posts_water_and_heat_in_one_proportion"
budget = 1000

[[mutant]]
