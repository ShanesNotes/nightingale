[[mutant]]
name = "airway-heat-reads-no-dead-space-water"
path = "crates/ng-respiratory/src/airway.rs"
old = '''            let [leaving, entering] = self.exhaled(&mut k, &held, &per, &room);
            let water = k.subtract(leaving, entering);'''
new = '''            let airway = (k.read(&held.0), k.read(&held.1), k.read(&held.2));
            let head = self.dead_space_head(&mut k, airway);
            let [inward, _] = self.parts(&mut k, head);
            let room_share = self.room_water(&mut k, &room);
            let water = self.at_the_room(&mut k, inward, room_share, &per);'''
test = "-p ng-validate --test elimination_order joining_rows_to_the_largest_block_stays_within_the_factoring_price"
