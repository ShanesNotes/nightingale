                space,
                Species::Energy,
            )
        }))
    };'''
test = "-p ng-contract --test routes body_energy_families_refuse_a_map_without_a_tissue_root"

[[mutant]]
name = "reach-selector-drops-missing-partner"
path = "crates/ng-contract/src/compile.rs"
old = '''                MissingPool::SelectBy(selector) => {
                    reaches.retain(|reach| has(reach.ends[selector as usize]));
                    refuse_missing(&reaches)?;
                }'''
new = '''                MissingPool::SelectBy(_) => {
                    reaches.retain(|reach| reach.ends.iter().all(|&end| has(end)));
                }'''
test = "-p ng-contract --test routes selector_families_refuse_a_missing_partner_when_selected"

