[[mutant]]
name = "reach-missing-root-store-dropped"
path = "crates/ng-contract/src/compile.rs"
old = '''    let require_store = |space: Space| {
        store(space).ok_or(CompileDefect::RouteEndpoint {
            law,
            site: None,
            space,
            species: Species::Energy,
        })
