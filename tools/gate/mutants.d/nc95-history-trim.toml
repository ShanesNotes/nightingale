[[mutant]]
name = "trim-witness-seal-unchecked-on-restore"
path = "crates/ng-record/src/history.rs"
old = '''    if let Some(witness) = store.resolve_witness(&at) {
        if witness.seal(hash, revision) != at {
            return Err(CheckpointError::HistoryAltered { seal: at });
        }
        return Ok((witness.previous(), None));
    }'''
new = '''    if let Some(witness) = store.resolve_witness(&at) {
        return Ok((witness.previous(), None));
    }'''
test = "-p ng-validate --test history_trim a_trimmed_restore_checks_every_seal_head_link_and_opening_without_reparsing_discarded_ledgers"

