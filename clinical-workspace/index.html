<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Clinical workspace</title>
    <style>
      table { border-collapse: collapse; }
      th, td { border: 1px solid #888; padding: 2px 6px; text-align: left; vertical-align: top; }
      #note-text, #edit-text { display: block; width: 40em; max-width: 100%; }
      #note-list { list-style: none; padding: 0; max-width: 48em; }
      .note { border: 1px solid #888; padding: 2px 8px; margin: 6px 0; }
      .note p { margin: 4px 0; }
      .note-text { white-space: pre-wrap; overflow-wrap: anywhere; }
      .note-head, .note-charted { color: #444; }
    </style>
  </head>
  <body>
    <div id="workspace"></div>
    <script type="module" src="/src/pages/workspace.ts"></script>
  </body>
</html>
